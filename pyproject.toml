[project]
name = "surgground"
version = "0.1.0"
description = "Downstream clinical tasks on full-length surgical video (2-hour procedures): temporal grounding, phase/step segmentation, RSD, grounded QA + abstention. Runs on a single RTX 4090."
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "transformers>=4.49,<4.53",
    "accelerate>=1.0",
    "peft>=0.13",
    "trl>=0.12",
    "bitsandbytes>=0.44",           # 4-bit NF4 + paged 8-bit AdamW (Linux)
    "lightning>=2.4,<3",
    "einops>=0.8",
    "timm>=1.0",
    "huggingface_hub>=0.25",
    "decord>=0.6",                  # fast frame reads (torchcodec is the fallback)
    "av>=12",
    "omegaconf>=2.3",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pyarrow>=15",                  # parquet frame index
    "pillow>=10",
    "tqdm>=4.66",
    "tensorboard>=2.14",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev      = ["pytest>=8", "ruff>=0.6"]
download = ["gdown>=5", "synapseclient>=4"]   # GraSP (Drive) / HeiChole (Synapse)
metrics  = ["ivtmetrics>=0.1.2", "pycocoevalcap>=1.2"]   # CholecT50 triplets / QA-summary NLP metrics
demo     = ["gradio>=4.44"]
flash    = ["flash-attn>=2.6"]                 # optional; needs nvcc, setup never blocks on it
mamba    = ["mamba-ssm>=2.2", "causal-conv1d>=1.4"]
vllm     = ["vllm>=0.6"]                       # faster offline RL rollouts

[project.scripts]
surgground-eval = "surgground.eval.run_eval:main"
surgground-aggregate = "surgground.eval.aggregate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["surgground*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B008", "E741"]
# `ruff check --fix` (adds "I", "UP") is fine to run; kept out of the gate to
# avoid churn while the tree is mostly stubs.

# P3/P5/P8/P9 — evaluation. Merge over default.yaml.
eval:
  tiou_thresholds: [0.3, 0.5, 0.7]
  length_buckets_min: [30, 60, 120]     # <30 / 30-60 / 60-120 / >120
  bootstrap: 1000                       # video-level CIs
  judge_model: Qwen/Qwen2.5-7B-Instruct
  methods: [zeroshot, sft, recursive, retrieve, rl_offline, full]
  reliability:
    conf_source: [verbalized, seq_logprob]
    ece_bins: 15
    risk_at_coverage: 0.8
  efficiency:
    warmup_queries: 20
    measure_queries: 100

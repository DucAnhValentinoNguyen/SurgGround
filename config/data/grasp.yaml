dataset: grasp
domain: robotic                # da Vinci — visually distinct from the laparoscopic sets
center: uniandes
role: primary_long_headline   # 13 videos, ~149 min avg (up to ~4 h). The hard headline.
native: frames                # ships sampled frames (~1 fps) + JSON ; no re-decode
ann_fps: 1                     # verify in P1 (phases/steps dense ; atomic actions ~1 keyframe/35 s)
# Counts (11 phases / 21 steps / 14 atomic actions / 7 instrument types) are
# confirmed from github.com/BCV-Uniandes/GraSP Images/dataset.jpg + TAPIS's
# TASKS.NUM_CLASSES; exact NAMES are best-effort (standard RARP breakdown) and
# unverified -- see procedure_graphs/grasp.json `_verify_p1`. Re-fill once
# grasp.sh's shipped JSON `categories` field is on disk.
phase_names:                   # 11, best-effort -- see _verify_p1 above
  - TrocarPlacementAndDocking
  - PelvicLymphadenectomy
  - BladderNeckDissection
  - SeminalVesicleDissection
  - PosteriorDissection
  - EndopelvicFasciaIncision
  - ApicalDissection
  - UrethralDivision
  - NeurovascularBundlePreservation
  - PosteriorAnastomosis
  - AnteriorAnastomosis
step_names: TODO_P1           # 21 ; not modeled -- no offline source, needs the shipped JSON
atomic_action_names: TODO_P1  # 14 ; ditto
phase_graph: procedure_graphs/grasp.json
split: { scheme: by_video, train: 8, val: 2, test: 3 }   # tiny -> report per-video + bootstrap CIs
never_pool_with: [cholec80, autolaparo, multibypass140, heichole, cholect50]   # domain tag; report separately
